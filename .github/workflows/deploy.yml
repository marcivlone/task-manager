# Имя нашего процесса
name: Deploy to VPS

# Запускаем этот процесс при пуше в ветку main
on:
  push:
    branches: [ master ]

# Описываем, что именно будет делать процесс
jobs:
  deploy:
    # Запускаем на стандартном образе Ubuntu
    runs-on: ubuntu-latest

    steps:
      # 1. Берём последнюю версию кода из репозитория
      - name: Checkout code
        uses: actions/checkout@v4

      # 2. Устанавливаем Node.js нужной версии
      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '20'

      # 3. Устанавливаем зависимости проекта
      - name: Install dependencies
        run: npm ci

      - name: Install client dependencies
        run: npm --prefix client ci

      - name: Run tests
        run: npm run test:ci

      - name: Upload test report
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: unit-test-report
          path: client/test-results/junit.xml

      - name: Add test report summary
        if: always()
        run: |
          echo "### Unit test report" >> $GITHUB_STEP_SUMMARY
          echo "" >> $GITHUB_STEP_SUMMARY
          if [ -f client/test-results/junit.xml ]; then
            echo "| Metric | Value |" >> $GITHUB_STEP_SUMMARY
            echo "| --- | --- |" >> $GITHUB_STEP_SUMMARY
            grep "<!-- tests " client/test-results/junit.xml | sed 's/.*<!-- tests /| Tests | /; s/ -->/ |/' >> $GITHUB_STEP_SUMMARY
            grep "<!-- pass " client/test-results/junit.xml | sed 's/.*<!-- pass /| Passed | /; s/ -->/ |/' >> $GITHUB_STEP_SUMMARY
            grep "<!-- fail " client/test-results/junit.xml | sed 's/.*<!-- fail /| Failed | /; s/ -->/ |/' >> $GITHUB_STEP_SUMMARY
            echo "" >> $GITHUB_STEP_SUMMARY
            echo "Full JUnit report is available in the unit-test-report artifact." >> $GITHUB_STEP_SUMMARY
          else
            echo "JUnit report was not generated." >> $GITHUB_STEP_SUMMARY
          fi

      # 4. Настраиваем SSH-ключ для доступа к серверу
      - name: Setup SSH Key
        run: |
          mkdir -p ~/.ssh
          echo "${{ secrets.SSH_PRIVATE_KEY }}" > ~/.ssh/id_rsa
          chmod 600 ~/.ssh/id_rsa
          ssh-keyscan -H ${{ secrets.SERVER_IP }} >> ~/.ssh/known_hosts

      # 5. Переносим код на сервер и перезапускаем приложение
      - name: Deploy to Server
        run: |
          ssh ${{ secrets.SERVER_USER }}@${{ secrets.SERVER_IP }} "
            cd /var/www/task-manager && \
            git pull origin master && \
            npm install && \
            pm2 restart task-manager
          "
